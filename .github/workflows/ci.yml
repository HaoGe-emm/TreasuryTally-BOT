name: CI

# Real external probes require explicit secrets and are intentionally excluded
# from this local-quality workflow; a mock is never reported as external success.

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -c requirements.lock.txt
      - run: python -m pytest -m "not external"
      - run: python -m ruff check .
      - run: python -m pip check
      - run: python scripts/export_schemas.py --check
      - run: python scripts/check_file_sizes.py
      - run: python scripts/run_mvp_demo.py
